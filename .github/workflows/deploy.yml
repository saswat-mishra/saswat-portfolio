name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` runs three steps: client build → SSR build → prerender.
      # The prerender injects static HTML into dist/index.html per route, and
      # Vite copies public/CNAME into dist/, so the published artifact is the
      # fully prerendered site with the custom domain.
      - name: Build (client + SSR prerender)
        env:
          VITE_GOOGLE_SCRIPT_URL: ${{ secrets.VITE_GOOGLE_SCRIPT_URL }}
        run: npm run build

      - name: Verify prerender output (CNAME + content in static HTML)
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME missing"; exit 1; }
          grep -q '<div id="root"><' dist/index.html \
            || { echo "::error::dist/index.html #root is empty — prerender did not run"; exit 1; }
          echo "CNAME: $(cat dist/CNAME) — prerendered HTML OK"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
