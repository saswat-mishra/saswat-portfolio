<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="author" content="Saswat Mishra" />
    <!-- robots is emitted per-route by <Seo> (index/follow, or noindex on tool
         routes) — see src/seo/Seo.jsx. Keeping it only there avoids a duplicate
         conflicting directive on noindex pages. -->
    <link rel="alternate" type="application/rss+xml" title="Saswat Mishra — Blog" href="/rss.xml" />
    <link rel="author" href="/humans.txt" />

    <!-- Per-route <head> (title, description, canonical, Open Graph/Twitter, JSON-LD)
         is injected here at build time from react-helmet-async during prerender,
         so every route ships complete, crawler-visible head metadata with no JS. -->
    <!--app-head-->

    <!-- Self-hosted fonts: preload the weights needed for first paint so they are
         ready before the hero headline / body text render (no swap reflow → CLS≈0)
         and there is no render-blocking external request (fast LCP). @font-face
         declarations live in index.css. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/orbitron-900.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/orbitron-800.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/jetbrains-mono-400.woff2" crossorigin />
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
